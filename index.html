<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyHack</title>

    <style>
        body{
            background:#111;
            color:white;
            font-family:Arial,sans-serif;
            max-width:900px;
            margin:auto;
            padding:30px;    
        }

        h1{
            text-align:center;
            color:#2563eb;
        p}
          text-align:center;
        }
        textarea{
            width:100%;
            height:250px;
            background:#222;
            color:white;
            border:1px solid #444;
            border-radius:10px;
            padding:15px;
            font-size:16px;      
        }

        button{
            background:#22c55e;
            color:white;
            border:none;
            padding:15px 25px;
            border-radius:10px;
            font-size:16px;
            cursor:pointer;
            margin-top:15px;        
        }

        button:hover{
            background black:#0000
        }

        #resultado{
           margin-top:20px;
           background:#1e1e1e;
           border-radius:10px;
           padding:20px;        
        }
    </style>
</head>
<body>

    <h1>🚀 StudyHack AI</h1>

    <p>La forma más rápida de convertir apuntes en resúmenes.</p>

    <textarea id="texto"></textarea>

    <br>

    <button onclick="generarResumen()">
        Generar resumen
    </button>

    <div id="resultado"></div>

    <script>
        function generarResumen() {

            let texto =
                document.getElementById("texto").value;

            let palabras =
                texto.split(" ")
                     .slice(0,50)
                     .join(" ");

            document.getElementById("resultado").innerHTML =
                "<h2>Resumen</h2><p>" +
                palabras +
                "...</p>";
        }
    </script>

</body>
</html>
